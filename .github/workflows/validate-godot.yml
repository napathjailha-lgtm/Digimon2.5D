name: Validate Godot Feature

on:
  push:
    branches:
      - feature/rpg-services-equipment-incubator
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Import and parse project
        run: python3 tools/check_godot.py --headless --path . --editor --quit
      - name: Validate every shipped script and resource
        run: python3 tools/check_godot.py --headless --path . --script res://tests/project_integrity.gd

      - name: Resource load smoke test
        run: python3 tools/check_godot.py --headless --path . --script res://tests/resource_load_smoke.gd
      - name: Boot and menu runtime regression
        run: python3 tools/check_godot.py --headless --path . res://tests/current_runtime_test.tscn

      - name: Adventure partner evolution and combat regression
        run: python3 tools/check_godot.py --headless --path . res://tests/adventure_partners_test.tscn

      - name: Inventory, loot and consumable regression
        run: python3 tools/check_godot.py --headless --path . res://tests/inventory_loot_test.tscn

      - name: Validate Web export
        run: |
          mkdir -p /tmp/digimon-web
          python3 tools/check_godot.py --headless --path . --export-release "Web" /tmp/digimon-web/index.html
