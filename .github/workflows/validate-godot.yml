name: Validate Godot Feature

on:
  push:
    branches:
      - feature/rpg-services-equipment-incubator
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Import and parse project
        run: godot --headless --path . --editor --quit
      - name: Validate Web export
        run: |
          mkdir -p /tmp/digimon-web
          godot --headless --path . --export-release "Web" /tmp/digimon-web/index.html
