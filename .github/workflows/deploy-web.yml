name: Export Godot Web and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject committed signing secrets
        run: |
          set -eu
          signing_files="$(git ls-files | grep -Ei '\.(keystore|jks|p12|pfx)
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Verify project
        run: python3 tools/check_godot.py --headless --path . --editor --quit

      - name: Validate Android online permission
        run: |
          grep -q 'name="Android Test"' export_presets.cfg
          grep -q 'permissions/internet=true' export_presets.cfg
          grep -q 'server_url="wss://online-server-production-aa88.up.railway.app"' project.godot

      - name: Validate online server syntax
        run: node --check server/online-server/server.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Online server safety regression
        working-directory: server/online-server
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Validate every shipped script and resource
        run: python3 tools/check_godot.py --headless --path . --script res://tests/project_integrity.gd

      - name: Resource load smoke test
        run: python3 tools/check_godot.py --headless --path . --script res://tests/resource_load_smoke.gd

      - name: Online client lifecycle regression
        run: python3 tools/check_godot.py --headless --path . res://tests/online_lifecycle_test.tscn

      - name: Boot and menu runtime regression
        run: python3 tools/check_godot.py --headless --path . res://tests/current_runtime_test.tscn

      - name: Adventure partner progression test
        run: python3 tools/check_godot.py --headless --path . res://tests/adventure_partners_test.tscn

      - name: Inventory, loot and consumable regression
        run: python3 tools/check_godot.py --headless --path . res://tests/inventory_loot_test.tscn

      - name: Frontier quest chain regression
        run: python3 tools/check_godot.py --headless --path . res://tests/frontier_quests_test.tscn

      - name: Export Web
        run: |
          mkdir -p build/web
          python3 tools/check_godot.py --headless --path . --export-release "Web" build/web/index.html

      - name: Install Prism web loader
        run: |
          python3 -c 'import json, os; open("build/web/version.json", "w").write(json.dumps({"commit": os.environ["GITHUB_SHA"]}))'
          cp assets/ui/splash/prism_tamer_frontier.svg build/web/prism_tamer_frontier.svg
          python3 tools/patch_web_loader.py build/web/index.html
          grep -q 'id="prism-preloader"' build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
 || true)"
          if [ -n "$signing_files" ]; then
            echo "::error::Signing material must never be committed to the repository."
            printf '%s\n' "$signing_files"
            exit 1
          fi
          if grep -Eq 'keystore/(debug|release)="res://' export_presets.cfg; then
            echo "::error::Android signing keys must not be referenced from res://."
            exit 1
          fi
          if grep -Eq 'keystore/(debug|release)_(user|password)=' export_presets.cfg; then
            echo "::error::Android signing credentials must not be stored in export_presets.cfg."
