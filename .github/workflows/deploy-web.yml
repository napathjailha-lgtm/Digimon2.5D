name: Deploy Maintenance Page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build maintenance page
        run: |
          mkdir -p build/web
          cat > build/web/index.html <<'EOF'
          <!doctype html>
          <html lang="th">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <title>Prism Tamer Frontier — Maintenance</title>
            <style>
              html,body{height:100%;margin:0}
              body{display:grid;place-items:center;background:#07111c;color:#edf7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
              main{max-width:620px;padding:42px;text-align:center}
              h1{font-size:clamp(30px,6vw,54px);margin:0 0 18px}
              p{font-size:clamp(16px,2.3vw,21px);line-height:1.65;color:#b8cadd}
              .badge{display:inline-block;padding:8px 14px;border:1px solid #5aa9d6;border-radius:999px;color:#7fd2ff;margin-bottom:22px}
            </style>
          </head>
          <body>
            <main>
              <div class="badge">SERVER CLOSED</div>
              <h1>ปิดให้บริการชั่วคราว</h1>
              <p>เกมอยู่ระหว่างปรับปรุงระบบและตรวจสอบข้อมูลผู้เล่น จึงปิดการเข้าเล่นชั่วคราว</p>
              <p>หน้าเกมและไฟล์ Godot Web ไม่ได้ถูกเผยแพร่ในช่วง Maintenance นี้</p>
            </main>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload maintenance artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy maintenance page
        id: deployment
        uses: actions/deploy-pages@v4
