name: Export Godot Web and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Verify project
        run: godot --headless --path . --editor --quit

      - name: Resource load smoke test
        run: godot --headless --path . --script res://tests/resource_load_smoke.gd

      - name: Adventure partner progression test
        run: godot --headless --path . res://tests/adventure_partners_test.tscn

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Install Prism web loader
        run: |
          cp assets/ui/splash/prism_tamer_wide.jpg build/web/prism_tamer_wide.jpg
          cp assets/ui/splash/prism_tamer_portrait.jpg build/web/prism_tamer_portrait.jpg
          python3 tools/patch_web_loader.py build/web/index.html
          grep -q 'id="prism-preloader"' build/web/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
